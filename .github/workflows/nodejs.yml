name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job only checks out and tests; nothing writes to the repository.
permissions:
  contents: read

jobs:
  build:
    # The active LTS lines. The integration and build test suites have a
    # higher floor and run in the build-test job instead: their JPEG XL
    # fixtures need the Brotli support added in Node.js 24.7, and they
    # require() the ES module source which needs 22.12+.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22.x
          - os: ubuntu-latest
            node-version: 24.x
          - os: windows-latest
            node-version: 24.x
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm ci
    - run: npm run lint
    - run: npm run test
    - run: npm run test:types
    - run: npm run build
  build-test:
    # `npm run test:build` and `npm run test:integration` need Node.js 24.7+
    # because of the Brotli compression used in JPEG XL files.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Use Node.js 24.x
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24.x
    - run: npm ci
    - run: npm run test:build
      env:
        CI: true
    - run: npm run test:integration
  package-ubuntu-full:
    # `npm run test:build:custom` needs Node.js 24.7+ because of the Brotli compression used in JPEG XL files.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Use Node.js 24.x
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24.x
    - run: npm ci
    - name: Test npm package and custom builds with minimal requirements
      run: |
        PATH=$(echo "$PATH" | sed -e 's/:\/usr\/local\/bin://'):/usr/local/bin/npm:/usr/local/bin/node
        npm run test:build:custom
  runtime-bun:
    # Resolves and loads the packed package under Bun. The consumer gets the
    # tarball extracted, not installed, like test/build/packaging.js does.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Use Node.js 24.x
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24.x
    - name: Extract the packed package into a consumer
      run: |
        npm pack --ignore-scripts
        mkdir -p "$RUNNER_TEMP/consumer/node_modules"
        tar -xzf exifreader-*.tgz -C "$RUNNER_TEMP/consumer/node_modules"
        mv "$RUNNER_TEMP/consumer/node_modules/package" "$RUNNER_TEMP/consumer/node_modules/exifreader"
        echo '{"private": true}' > "$RUNNER_TEMP/consumer/package.json"
        cp test/packaging/runtime-smoke.mjs "$RUNNER_TEMP/consumer/"
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
    - run: bun runtime-smoke.mjs "$GITHUB_WORKSPACE/test/fixtures/images/test.jpg"
      working-directory: ${{ runner.temp }}/consumer
  runtime-deno:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Use Node.js 24.x
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24.x
    - name: Extract the packed package into a consumer
      run: |
        npm pack --ignore-scripts
        mkdir -p "$RUNNER_TEMP/consumer/node_modules"
        tar -xzf exifreader-*.tgz -C "$RUNNER_TEMP/consumer/node_modules"
        mv "$RUNNER_TEMP/consumer/node_modules/package" "$RUNNER_TEMP/consumer/node_modules/exifreader"
        echo '{"private": true}' > "$RUNNER_TEMP/consumer/package.json"
        cp test/packaging/runtime-smoke.mjs "$RUNNER_TEMP/consumer/"
    - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
    - run: deno run --node-modules-dir=manual --allow-read runtime-smoke.mjs "$GITHUB_WORKSPACE/test/fixtures/images/test.jpg"
      working-directory: ${{ runner.temp }}/consumer
  package-windows-basic:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Use Node.js 20.x
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 20.x
    - run: npm ci
    - name: Test npm package with minimal requirements
      run: |
        npm pack
        $PackageVersion = ((node -p "require('./package.json').version") | Out-String).Trim()
        mkdir ../my-project
        cd ../my-project
        $regexRemovePath = [regex]::Escape('C:\npm\prefix')
        $arrPath = $env:Path -split ';' | Where-Object {$_ -notMatch "^$regexRemovePath\\?"}
        $env:Path = $arrPath -join ';'
        node -p "const {writeFileSync} = require('fs'); const packageJson = {exifreader: {include: {jpeg: true, exif: true}}, dependencies: {exifreader: '../ExifReader/exifreader-$($PackageVersion).tgz'}}; writeFileSync('package.json', JSON.stringify(packageJson));"
        if ($LastExitCode -ne 0) { throw (Get-PSCallStack | Out-String) }
        npm install --production
        if ($LastExitCode -ne 0) { throw (Get-PSCallStack | Out-String) }
        npm rebuild exifreader
        if ($LastExitCode -ne 0) { throw (Get-PSCallStack | Out-String) }
      shell: pwsh -command "$ErrorActionPreference = 'Stop'; & {0}"
