name: Publish package

on:
  push:
    tags:
      - "v*"

# Only the publish job gets the OIDC token; it installs nothing and runs no project code.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Releases push main before the tag, so a tag whose commit is not on main is a mistake.
      # show-ref --verify reads only the exact ref, so no tag named like it can stand in for main.
      - name: Refuse a tag whose commit is not on main
        run: |
          if ! main=$(git show-ref --verify --hash refs/remotes/origin/main) ||
             ! git merge-base --is-ancestor HEAD "$main"; then
            echo "::error::$GITHUB_REF_NAME ($(git rev-parse HEAD)) is not on main"
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run test:types
      - run: npm run build
      - run: npm run test:build
        env:
          CI: true
      - run: npm pack --ignore-scripts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-tarball
          path: exifreader-*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Outside the workspace, where npm would read an .npmrc from the artifact as project config.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-tarball
          path: ${{ runner.temp }}/package-tarball

      # A publishConfig in the tarball would override npm's registry and proxy during the token exchange.
      # Read with npm's own pacote call for a tarball, so the check sees the manifest npm publish acts on.
      - name: Refuse a tarball that sets publishConfig
        run: |
          node -e '
            const path = require("path");
            if (process.argv.length !== 2) {
              throw new Error("Expected exactly one tarball");
            }
            const pacote = require(path.join(path.dirname(process.execPath), "..", "lib", "node_modules", "npm", "node_modules", "pacote"));
            pacote.manifest("file:" + process.argv[1], {fullMetadata: true, fullReadJson: true}).then((manifest) => {
              if ("publishConfig" in manifest) {
                throw new Error("The tarball sets publishConfig");
              }
            });
          ' "$RUNNER_TEMP"/package-tarball/exifreader-*.tgz
      - run: npm publish "$RUNNER_TEMP"/package-tarball/exifreader-*.tgz
